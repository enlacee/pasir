<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mis cursos</title>
  <style>
    body{font-family:system-ui;margin:0;background:#0b1220;color:#f9fafb;min-height:100vh}
    header{padding:14px 16px;border-bottom:1px solid rgba(148,163,184,.25);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .card{border:1px solid rgba(148,163,184,.25);border-radius:16px;background:rgba(148,163,184,.06);padding:14px}
    .title{font-weight:1000}
    .muted{color:#9ca3af}
    .btn{display:inline-block;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:900}
    .primary{background:#22c55e;color:#071018;border:0;cursor:pointer}
    .secondary{background:rgba(56,189,248,.18);color:#f9fafb;border:1px solid rgba(56,189,248,.35)}
    .err{color:#fca5a5;font-weight:700;white-space:pre-wrap}
  

/* ===== Netflix-like cards ===== */
.hero{
  background: linear-gradient(120deg, rgba(0,0,0,.55), rgba(0,0,0,.85)), radial-gradient(circle at 20% 10%, rgba(34,197,94,.25), transparent 50%);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 18px 16px;
  margin-bottom: 16px;
}
.hero h1{margin:0 0 6px;font-size:20px}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:13px}
.rows{display:flex;flex-direction:column;gap:14px}
.row-title{display:flex;align-items:end;justify-content:space-between;margin:4px 0 8px}
.row-title h2{margin:0;font-size:16px}
.scroller{
  display:flex;
  gap:12px;
  overflow:auto;
  padding-bottom: 6px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling: touch;
}
.course-card{
  scroll-snap-align:start;
  min-width: 230px;
  max-width: 260px;
  flex: 0 0 auto;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.course-card:hover{
  transform: translateY(-2px);
  border-color: rgba(34,197,94,.35);
  box-shadow: 0 14px 30px rgba(0,0,0,.35);
}
.course-thumb{
  position:relative;
  aspect-ratio: 16/9;
  background: rgba(0,0,0,.4);
}
.course-thumb img{
  width:100%;
  height:100%;
  object-fit: cover;
  display:block;
}
.course-badge{
  position:absolute;left:10px;top:10px;
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(10px);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
}
.course-meta{
  padding: 12px 12px 14px;
}
.course-meta .title{
  font-weight:700;
  line-height:1.2;
  margin:0 0 6px;
  font-size:14px;
}
.course-meta .sub{
  margin:0;
  font-size:12px;
  color: rgba(255,255,255,.72);
}
@media (max-width: 520px){
  .course-card{min-width: 78vw; max-width: 84vw;}
}

</style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header>
    <div>
      <div class="title">Mis cursos</div>
      <div class="muted">Aquí verás solo los cursos que están habilitados para tu correo.</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn secondary" href="index.html">Volver</a>
      <button id="logout" class="btn primary">Cerrar sesión</button>
    </div>
  </header>

  <div class="wrap">
    <div id="status" class="muted">Cargando…</div>
    <div class="hero"><h1>Mis cursos</h1><p>Desliza y elige tu curso como una app premium.</p></div><div id="list" class="grid" style="margin-top:12px"></div>
  </div>

<script>
function escapeHtml_(s){
  return String(s||"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

  const API_URL = "https://pasir-proxy.vercel.app/api";

  function jsonp(action, payload) {
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const params = new URLSearchParams();
      params.set("action", action);
      Object.entries(payload || {}).forEach(([k,v]) => {
        if (v === undefined || v === null) return;
        params.set(k, String(v));
      });
      params.set("callback", cb);

      const script = document.createElement("script");
      script.src = API_URL + "?" + params.toString();
      script.async = true;

      window[cb] = (data) => {
        cleanup();
        resolve(data);
      };

      function cleanup() {
        try { delete window[cb]; } catch(e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      script.onerror = () => {
        cleanup();
        reject(new Error("No se pudo conectar (JSONP)."));
      };

      document.body.appendChild(script);
    });
  }

  const token = sessionStorage.getItem("pasir_token");
  if (!token) location.href = "login.html";

  document.getElementById("logout").onclick = () => {
    sessionStorage.removeItem("pasir_token");
    location.href = "index.html";
  };

  (async () => {
    try {
      const r = await jsonp("me", { token });
      if (!r.ok) {
        sessionStorage.removeItem("pasir_token");
        return location.href = "login.html";
      }

      const status = document.getElementById("status");
      const list = document.getElementById("list");

      if (!r.courses || r.courses.length === 0) {
        status.textContent = "Aún no tienes cursos habilitados. Si ya pagaste, espera a que lo active por WhatsApp.";
        list.innerHTML = "";
        return;
      }

      
      status.textContent = "";

      // Opcional: mapea imágenes locales por courseId.
      // Sube tus portadas a /assets/courses/ (en tu repo) con el nombre del courseId:
      // assets/courses/logo8-basico.jpg
      const COURSE_IMAGES = {
        // "logo8-basico": "assets/courses/logo8-basico.jpg",
      };

      const cards = r.courses.map(c => {
        const img =
          c.imageUrl ||
          COURSE_IMAGES[c.courseId] ||
          `assets/courses/${encodeURIComponent(c.courseId)}.jpg`;

        return `
          <a class="course-card" href="course.html?courseId=${encodeURIComponent(c.courseId)}">
            <div class="course-thumb">
              <img src="${img}" alt="${escapeHtml_(c.title)}"
                onerror="this.onerror=null;this.src='icons/icon-512.png';" />
              <div class="course-badge">Curso</div>
            </div>
            <div class="course-meta">
              <p class="title">${escapeHtml_(c.title)}</p>
              <p class="sub">${escapeHtml_(c.courseId)}</p>
            </div>
          </a>
        `;
      }).join("");

      list.innerHTML = `
        <div class="rows">
          <div>
            <div class="row-title"><h2>Mis cursos</h2></div>
            <div class="scroller">${cards}</div>
          </div>
        </div>
      `;
} catch (e) {
      document.getElementById("status").innerHTML = '<div class="err">'+(e.message || e)+'</div>';
    }
  })();
</script>

  <script>
  // PWA: registrar Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
