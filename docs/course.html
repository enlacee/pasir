<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Curso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h2 id="courseTitle"></h2>

  <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;">
    <iframe
      id="player"
      src=""
      style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-presentation"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    function cleanEmbedUrl_(url) {
      if (!url) return "";

      const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
      if (!match) return "";

      const videoId = match[1];

      return "https://www.youtube-nocookie.com/embed/" + videoId +
             "?rel=0&modestbranding=1&controls=1&disablekb=1";
    }

    function loadVideo(url) {
      const iframe = document.getElementById("player");
      iframe.src = cleanEmbedUrl_(url);
    }

    // EJEMPLO: Cambia esta URL por la que cargas dinámicamente
    const videoURL = "https://www.youtube.com/watch?v=TU_VIDEO_ID";
    loadVideo(videoURL);
  </script>

</body>
</html>
