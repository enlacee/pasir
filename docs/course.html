<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curso adaptable</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="stylesheet" href="app.css">
  <script src="theme.js" defer></script>
  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(255,255,255,.06);
      --panel2:rgba(255,255,255,.04);
      --stroke:rgba(148,163,184,.22);
      --text:#f9fafb;
      --muted:rgba(255,255,255,.70);
      --green:#22c55e;
      --blue:#38bdf8;
      --radius:22px;
    }

    *{box-sizing:border-box}
    html.auth-checking, html.auth-checking body{visibility:hidden}
    body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
    a{color:inherit}

    .app-header{padding:8px 14px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.04);backdrop-filter:blur(8px)}
    .app-header .container{max-width:1400px;margin:0 auto;padding:0}
    .app-header .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:1000;font-size:18px}
    .dot{width:14px;height:14px;border-radius:999px;background:#38bdf8;display:inline-block;box-shadow:0 0 0 8px rgba(56,189,248,.16)}
    .theme-btn{width:54px;height:54px;border-radius:999px;border:1px solid rgba(56,189,248,.22);background:rgba(255,255,255,.06);cursor:pointer}

    .page-shell{
      max-width:1400px;
      margin:0 auto;
      padding:18px;
    }

    .hero{
      background:linear-gradient(90deg, rgba(186,217,240,.20), rgba(180,200,255,.10));
      border:1px solid rgba(148,163,184,.18);
      border-radius:28px;
      padding:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.18);
    }

    .course-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding-bottom:16px;
      border-bottom:1px solid rgba(148,163,184,.18);
      margin-bottom:16px;
    }

    #courseTitle{
      font-size:clamp(28px, 3.4vw, 48px);
      line-height:1.02;
      font-weight:1000;
      margin:0;
      max-width:12ch;
      color:#0f172a;
    }

    .top-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .topbtn,.smallbtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:14px 18px;
      border-radius:18px;
      text-decoration:none;
      font-weight:1000;
      border:1px solid rgba(56,189,248,.4);
      background:rgba(186,230,253,.55);
      color:#0f172a;
      cursor:pointer;
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0, 1.9fr) minmax(320px, 0.95fr);
      gap:18px;
      align-items:start;
    }

    .player-wrap{
      position:relative;
      width:100%;
      border:1px solid var(--stroke);
      border-radius:28px;
      overflow:hidden;
      background:rgba(255,255,255,.12);
      box-shadow:0 18px 40px rgba(0,0,0,.20);
      min-width:0;
    }

    .player{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      background:#000;
    }

    .yt-player, iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }

    .tap-shield{
      position:absolute;
      inset:0;
      z-index:50;
      background:transparent;
      pointer-events:auto;
    }

    .player-meta{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      padding:14px 16px;
      background:rgba(255,255,255,.22);
      border-top:1px solid rgba(148,163,184,.18);
    }

    .player-meta .left{min-width:0}
    .player-meta .now{
      font-size:clamp(18px, 1.6vw, 26px);
      font-weight:1000;
      color:#0f172a;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    #nowPlaying{
      margin-top:6px;
      font-size:14px;
      color:rgba(15,23,42,.7);
    }

    .player-meta .right{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      min-width:0;
      flex-wrap:wrap;
    }

    .cc-wrap{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:nowrap;
      position:absolute;
      left:14px;
      right:14px;
      bottom:18px;
      z-index:60;
      opacity:0;
      transform:translateY(8px);
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
    }
    .cc-wrap.is-visible{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }
    .cc-btn{
      width:44px;
      height:40px;
      border:0;
      border-radius:12px;
      background:rgba(255,255,255,.12);
      color:#fff;
      font-size:18px;
      cursor:pointer;
    }
    .cc-speed{width:58px;font-size:14px}
    .cc-seek{flex:1;min-width:120px}
    .cc-time{
      font-variant-numeric:tabular-nums;
      color:#fff;
      font-size:13px;
      white-space:nowrap;
    }

    .curriculum{
      border:1px solid rgba(148,163,184,.18);
      border-radius:28px;
      overflow:hidden;
      background:rgba(255,255,255,.14);
      min-width:0;
    }
    .curriculum-h{
      padding:18px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      border-bottom:1px solid rgba(148,163,184,.18);
      background:rgba(255,255,255,.10);
    }
    .curriculum-h h2{
      margin:0;
      font-size:clamp(22px, 2.1vw, 34px);
      line-height:1;
      color:#0f172a;
    }
    .curriculum-h .sub{
      font-size:clamp(13px, 1.2vw, 16px);
      color:rgba(15,23,42,.8);
      margin-top:6px;
    }
    #countMods{
      font-size:14px;
      color:#0f172a;
      white-space:nowrap;
      padding-top:6px;
    }

    #modules{
      display:flex;
      flex-direction:column;
      max-height:calc(100vh - 250px);
      overflow:auto;
    }

    .mod{
      width:100%;
      text-align:left;
      display:flex;
      gap:14px;
      align-items:center;
      padding:14px 18px;
      border:0;
      background:transparent;
      color:inherit;
      cursor:pointer;
      border-bottom:1px solid rgba(148,163,184,.14);
    }
    .mod:last-child{border-bottom:0}
    .mod:hover{background:rgba(255,255,255,.09)}
    .mod.active{background:rgba(56,189,248,.10)}

    .mod .thumb{
      width:120px;
      aspect-ratio:16/9;
      border-radius:16px;
      overflow:hidden;
      background:rgba(0,0,0,.22);
      flex:0 0 auto;
      border:1px solid rgba(0,0,0,.10);
    }
    .mod .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .mod .info{
      min-width:0;
      flex:1;
    }
    .mod .info .t{
      margin:0;
      font-weight:1000;
      font-size:clamp(18px, 1.5vw, 22px);
      line-height:1.16;
      color:#0f172a;
    }
    .mod .info .s{
      margin:8px 0 0;
      font-size:clamp(14px, 1.05vw, 17px);
      color:rgba(15,23,42,.78);
    }

    .err{
      color:#b91c1c;
      font-weight:800;
      white-space:pre-wrap;
      padding:14px 18px;
    }

    #openYT,#userMenu,.user-menu,.user-dropdown{display:none !important}

    @media (max-width: 1100px){
      .layout{
        grid-template-columns:1fr;
      }
      #modules{
        max-height:none;
      }
      #courseTitle{
        max-width:none;
      }
    }

    @media (max-width: 700px){
      .page-shell{padding:10px}
      .hero{padding:12px;border-radius:20px}
      .course-top{
        flex-direction:column;
        align-items:flex-start;
      }
      .top-actions{width:100%}
      .topbtn{padding:12px 16px;border-radius:16px}
      .player-wrap,.curriculum{border-radius:20px}
      .curriculum-h{padding:14px}
      .mod{
        padding:12px 14px;
        gap:12px;
      }
      .mod .thumb{
        width:74px;
        border-radius:12px;
      }
      .mod .info .t{
        font-size:16px;
      }
      .mod .info .s{
        font-size:12px;
        margin-top:4px;
      }
      .player-meta{
        padding:12px 14px;
      }
      .player-meta .now{
        font-size:16px;
      }
      .cc-wrap{
        left:10px;
        right:10px;
        bottom:12px;
        gap:8px;
      }
      .cc-btn{
        width:38px;
        height:36px;
        border-radius:10px;
      }
      .cc-speed{width:50px}
      .cc-time{
        font-size:12px;
      }
    }

    body[data-theme="light"]{
      --text:#0f172a;
      --bg:#edf3fb;
    }
    body[data-theme="light"] .cc-btn{
      background:#eaf2ff;
      color:#0f172a;
      border:1px solid rgba(37,99,235,.22);
    }
    body[data-theme="light"] .cc-time{color:#fff}
  </style>

  <script>
    document.documentElement.classList.add("auth-checking");
    (function () {
      const token = localStorage.getItem("pasir_token");
      if (!token) {
        location.replace("login.html");
        return;
      }
      document.documentElement.classList.remove("auth-checking");
    })();
  </script>
</head>
<body data-theme="light">
  <header class="app-header">
    <div class="container">
      <div class="row">
        <div class="brand" role="banner">
          <span class="dot" aria-hidden="true"></span>
          <span>Pasir Academy</span>
        </div>
        <div class="nav-actions">
          <button class="theme-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">
            <span id="theme-icon">☀️</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero">
      <div class="course-top">
        <div>
          <h1 id="courseTitle">Cargando…</h1>
          <div id="nowPlaying"></div>
        </div>
        <div class="top-actions">
          <a class="topbtn" href="account.html">⬅ Mis cursos</a>
        </div>
      </div>

      <div class="layout">
        <section class="player-wrap" aria-label="Reproductor">
          <div class="player">
            <div id="player" class="yt-player"></div>
            <div id="tapShield" class="tap-shield" aria-label="Zona protegida del video"></div>
            <div class="cc-wrap" id="ccWrap" aria-label="Controles del video">
              <button class="cc-btn" id="ccPlay" type="button" aria-label="Reproducir / Pausar">▶</button>
              <input class="cc-seek" id="ccSeek" type="range" min="0" max="1000" value="0" aria-label="Línea de tiempo">
              <span class="cc-time" id="ccTime">0:00 / 0:00</span>
              <button class="cc-btn cc-speed" id="ccSpeedBtn" type="button" aria-label="Velocidad">1x</button>
              <button class="cc-btn" id="ccFs" type="button" aria-label="Pantalla completa">⛶</button>
            </div>
          </div>
          <div class="player-meta">
            <div class="left">
              <div class="now" id="nowTitle">Reproduciendo</div>
            </div>
          </div>
        </section>

        <section class="curriculum" aria-label="Módulos">
          <div class="curriculum-h">
            <div>
              <h2>Módulos</h2>
              <div class="sub">Selecciona una clase para reproducir</div>
            </div>
            <div id="countMods"></div>
          </div>
          <div id="modules"></div>
          <div id="msg" class="err"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    let YTPlayer = null;
    let YTReady = false;
    let pendingVideoId = null;
    let videoLoadedFlag = false;

    function fmtTime_(sec){
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    function normalizeVideoId_(value){
      if (!value) return "";
      const v = String(value).trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
      const m = v.match(/(?:youtu\.be\/|v=|\/embed\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : "";
    }

    function ensureYT_(){
      if (document.getElementById("ytApiLoaded")) return;
      const s = document.createElement("script");
      s.id = "ytApiLoaded";
      s.src = "https://www.youtube.com/iframe_api";
      s.async = true;
      document.head.appendChild(s);
    }

    function loadVideoById_(videoId, autoplay){
      const vid = normalizeVideoId_(videoId);
      if (!vid) return;
      if (YTReady && YTPlayer && typeof YTPlayer.loadVideoById === "function"){
        YTPlayer.loadVideoById({ videoId: vid, startSeconds: 0 });
        if (autoplay) YTPlayer.playVideo();
      } else {
        pendingVideoId = vid;
      }
    }

    function setupControls_(){
      const btn = document.getElementById("ccPlay");
      const seek = document.getElementById("ccSeek");
      const time = document.getElementById("ccTime");
      const fs = document.getElementById("ccFs");
      const wrap = document.querySelector(".player-wrap");
      const speedBtn = document.getElementById("ccSpeedBtn");
      const speedRates = [0.5, 0.75, 1, 1.25, 1.5, 2];
      let speedIdx = 2;
      let seeking = false;

      function applySpeed_(){
        if (!YTPlayer) return;
        const r = speedRates[speedIdx] || 1;
        try { YTPlayer.setPlaybackRate(r); } catch(e) {}
        if (speedBtn) speedBtn.textContent = (r % 1 === 0 ? String(r).replace(".0","") : String(r)) + "x";
      }

      if (speedBtn){
        speedBtn.addEventListener("click", () => {
          speedIdx = (speedIdx + 1) % speedRates.length;
          applySpeed_();
        });
      }

      if (btn){
        btn.addEventListener("click", () => {
          if (!YTPlayer) return;
          const st = YTPlayer.getPlayerState();
          if (st === 1) YTPlayer.pauseVideo();
          else YTPlayer.playVideo();
        });
      }

      if (seek){
        seek.addEventListener("input", () => { seeking = true; });
        seek.addEventListener("change", () => {
          if (!YTPlayer) return;
          const dur = YTPlayer.getDuration ? YTPlayer.getDuration() : 0;
          const v = Number(seek.value || 0) / 1000;
          if (dur > 0) YTPlayer.seekTo(dur * v, true);
          seeking = false;
        });
      }

      async function toggleFs(){
        if (!wrap) return;
        try{
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFs){
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
          } else {
            if (wrap.requestFullscreen) await wrap.requestFullscreen();
            else if (wrap.webkitRequestFullscreen) await wrap.webkitRequestFullscreen();
          }
        }catch(e){}
      }

      if (fs) fs.addEventListener("click", toggleFs);

      setInterval(() => {
        if (!YTPlayer) return;
        if (seek && !seeking){
          const dur = YTPlayer.getDuration ? YTPlayer.getDuration() : 0;
          const cur = YTPlayer.getCurrentTime ? YTPlayer.getCurrentTime() : 0;
          if (dur > 0){
            seek.value = String(Math.round((cur / dur) * 1000));
            if (time) time.textContent = fmtTime_(cur) + " / " + fmtTime_(dur);
          }
        }
      }, 500);
    }

    window.onYouTubeIframeAPIReady = function(){
      YTReady = true;
      YTPlayer = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          controls: 0,
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          playsinline: 1,
          disablekb: 1,
          fs: 0
        },
        events: {
          onReady: () => {
            setupControls_();
            if (pendingVideoId){
              loadVideoById_(pendingVideoId, false);
              pendingVideoId = null;
            }
          },
          onStateChange: (e) => {
            const btn = document.getElementById("ccPlay");
            if (!btn) return;
            btn.textContent = e.data === 1 ? "⏸" : "▶";
          }
        }
      });
    };

    ensureYT_();

    function escapeHtml_(s){
      return String(s || "").replace(/[&<>"']/g, function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
      });
    }

    const API_URL = "https://pasir-proxy.vercel.app/api";

    function jsonp(action, payload) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(36).slice(2);
        const params = new URLSearchParams();
        params.set("action", action);
        Object.entries(payload || {}).forEach(([k,v]) => {
          if (v === undefined || v === null) return;
          params.set(k, String(v));
        });
        params.set("callback", cb);

        const script = document.createElement("script");
        script.src = API_URL + "?" + params.toString();
        script.async = true;

        window[cb] = (data) => {
          cleanup();
          resolve(data);
        };

        function cleanup() {
          try { delete window[cb]; } catch(e) { window[cb] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = () => {
          cleanup();
          reject(new Error("No se pudo conectar (JSONP)."));
        };

        document.body.appendChild(script);
      });
    }

    const token = localStorage.getItem("pasir_token");
    if (!token) location.replace("login.html");

    const params = new URLSearchParams(location.search);
    const courseId = params.get("courseId");

    function setActive(btn){
      document.querySelectorAll(".mod").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    function showError(text){
      document.getElementById("msg").textContent = text || "";
    }

    (async () => {
      if (!courseId) {
        showError("Falta courseId en la URL. Ej: course.html?courseId=logo8-basico");
        return;
      }

      const r = await jsonp("course", { token, courseId });
      if (!r.ok) {
        showError(r.error || "No se pudo cargar el curso.");
        if ((r.error || "").toLowerCase().includes("no autorizado")) {
          setTimeout(() => location.replace("account.html"), 800);
        }
        return;
      }

      document.getElementById("courseTitle").textContent = (r.course && r.course.title) || courseId;
      const box = document.getElementById("modules");
      box.innerHTML = "";
      showError("");

      const modules = Array.isArray(r.modules) ? r.modules : [];
      document.getElementById("countMods").textContent = modules.length + " clases";

      modules.forEach((m, i) => {
        const b = document.createElement("button");
        b.className = "mod";
        const videoId = (m.videoId) || ((m.embedUrl || "").split("/embed/")[1] || "").split("?")[0] || "";
        const thumb = videoId ? "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg" : "icons/icon-192.png";
        const order = m.order || (i + 1);
        const title = m.title || "Clase";

        b.innerHTML = `
          <div class="thumb"><img src="${thumb}" alt=""></div>
          <div class="info">
            <p class="t">${escapeHtml_(order + ". " + title)}</p>
            <p class="s">Toca para reproducir</p>
          </div>
        `;

        b.onclick = () => {
          setActive(b);
          videoLoadedFlag = true;
          loadVideoById_(videoId, false);
          document.getElementById("nowPlaying").textContent = "Reproduciendo: " + title;
          const nt = document.getElementById("nowTitle");
          if (nt) nt.textContent = title;
          if (window.__showCustomControls) window.__showCustomControls();
        };

        box.appendChild(b);
      });

      if (modules.length > 0) {
        box.querySelector(".mod")?.click();
      }
    })().catch(err => {
      showError(err.message || String(err));
    });

    (function(){
      const shield = document.getElementById("tapShield");
      const wrap = document.getElementById("ccWrap");
      let hideTimer = null;

      function showControls(){
        if (!wrap || !videoLoadedFlag) return;
        wrap.classList.add("is-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          wrap.classList.remove("is-visible");
        }, 3200);
      }

      if (shield){
        shield.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          showControls();
        }, {passive:false});

        shield.addEventListener("touchstart", (e) => {
          e.preventDefault();
          e.stopPropagation();
          showControls();
        }, {passive:false});
      }

      if (wrap){
        wrap.addEventListener("pointerdown", () => {
          if (hideTimer) clearTimeout(hideTimer);
        });
        wrap.addEventListener("pointerup", () => {
          showControls();
        });
      }

      window.__showCustomControls = showControls;
    })();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
