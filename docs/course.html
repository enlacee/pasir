<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Curso</title>
  <style>
    :root {
      --bg:#061018;
      --panel:#0b1a26;
      --panel2:#0f2231;
      --text:#e8f0f7;
      --muted:#93a7b8;
      --border:rgba(255,255,255,.08);
      --accent:#22c55e;
      --accent2:#22a6f0;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%, rgba(34,166,240,.18), transparent 55%),
                  radial-gradient(900px 700px at 110% 0%, rgba(34,197,94,.15), transparent 55%),
                  var(--bg);
      color:var(--text);
      min-height:100svh;
    }
    a{color:inherit}
    /* Backdrop + modal (estilo Udemy) */
    .backdrop{
      min-height:100svh;
      padding:18px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .modal{
      width:min(1120px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .modalHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      padding:18px 18px 10px 18px;
      background: linear-gradient(180deg, rgba(0,0,0,.22), transparent);
    }
    .tag{
      font-size:13px;
      color:var(--muted);
      margin-bottom:6px;
    }
    h1{
      font-size:20px;
      margin:0;
      line-height:1.25;
      letter-spacing:.2px;
    }
    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
    }
    .headerBtns{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding:10px 14px;
      border-radius:14px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{background: rgba(255,255,255,.06)}
    .btnPrimary{
      background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(34,197,94,.75));
      border:none;
      color:#05210f;
    }
    .btnPrimary:hover{filter:brightness(1.05)}
    .btnIcon{
      width:42px;height:42px;justify-content:center;padding:0;border-radius:14px;
    }
    .x{
      font-size:18px;line-height:1;margin-top:1px;
    }
    .content{
      display:grid;
      grid-template-columns: 1.4fr .9fr;
      gap:16px;
      padding: 0 18px 18px 18px;
    }
    /* Player */
    .playerCard{
      border:1px solid var(--border);
      border-radius:20px;
      background: rgba(0,0,0,.25);
      overflow:hidden;
      min-height: 280px;
    }
    .playerWrap{
      position:relative;
      width:100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    #player{
      position:absolute; inset:0;
      width:100%; height:100%;
      border:0;
    }
    .playerMeta{
      padding:12px 14px 14px 14px;
    }
    .nowPlaying{
      font-size:14px;
      color:var(--muted);
      margin:0 0 6px 0;
    }
    .lessonTitle{
      font-size:16px;
      font-weight:800;
      margin:0;
    }
    .playerActions{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .hint{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
    }
    /* List */
    .listCard{
      border:1px solid var(--border);
      border-radius:20px;
      background: rgba(255,255,255,.03);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 420px;
    }
    .listHeader{
      padding:14px 14px 12px 14px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .listHeader h2{
      margin:0;
      font-size:15px;
      letter-spacing:.2px;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background: rgba(0,0,0,.18);
      white-space:nowrap;
    }
    .search{
      margin:0 14px 12px 14px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.18);
      border-radius:14px;
      padding:10px 12px;
      color:var(--text);
      outline:none;
    }
    .lessons{
      padding: 0 10px 12px 10px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    .lesson{
      display:grid;
      grid-template-columns: 88px 1fr;
      gap:10px;
      padding:10px;
      border-radius:16px;
      cursor:pointer;
      border:1px solid transparent;
    }
    .lesson:hover{
      background: rgba(255,255,255,.04);
      border-color: rgba(255,255,255,.06);
    }
    .lesson.active{
      background: rgba(34,166,240,.12);
      border-color: rgba(34,166,240,.22);
    }
    .thumb{
      width:88px;
      aspect-ratio: 16/9;
      border-radius:12px;
      overflow:hidden;
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      position:relative;
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; filter:saturate(1.05) contrast(1.05); }
    .playBadge{
      position:absolute;
      right:8px; bottom:8px;
      width:26px; height:26px;
      border-radius:999px;
      background: rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.18);
      display:grid;
      place-items:center;
      font-size:12px;
    }
    .lessonInfo .t{
      font-weight:800;
      font-size:13.5px;
      line-height:1.25;
      margin:0;
    }
    .lessonInfo .m{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .dot{opacity:.5}
    .watched{
      display:inline-flex; align-items:center; gap:6px;
      color: rgba(34,197,94,.95);
      font-weight:800;
    }
    .watchedIcon{
      width:18px;height:18px;border-radius:999px;
      background: rgba(34,197,94,.18);
      border:1px solid rgba(34,197,94,.35);
      display:grid; place-items:center;
      font-size:12px;
    }
    .errorBox{
      margin:10px 18px 18px 18px;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid rgba(239,68,68,.25);
      background: rgba(239,68,68,.08);
      color: #ffd1d1;
      display:none;
    }

    /* Responsive */
    @media (max-width: 920px){
      .content{ grid-template-columns: 1fr; }
      .listCard{ min-height: 360px; }
    }
    @media (max-width: 520px){
      .backdrop{ padding:10px; }
      .modalHeader{ padding:14px 14px 8px 14px; }
      h1{ font-size:18px; }
      .btn{ padding:10px 12px; border-radius:14px; }
      .btnIcon{ width:40px; height:40px; }
      .content{ padding: 0 14px 14px 14px; }
      .lesson{ grid-template-columns: 96px 1fr; }
      .thumb{ width:96px; }
    }
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHeader">
        <div>
          <div class="tag">Vista previa del curso</div>
          <h1 id="courseTitle">Cargando…</h1>
          <div class="sub" id="courseSubtitle">Preparando contenido…</div>
        </div>

        <div class="headerBtns">
          <button class="btn" id="btnBack">← Mis cursos</button>
          <button class="btn btnPrimary" id="btnLogout">Cerrar sesión</button>
          <button class="btn btnIcon" id="btnClose" title="Cerrar"><span class="x">✕</span></button>
        </div>
      </div>

      <div class="errorBox" id="errBox"></div>

      <div class="content">
        <div class="playerCard">
          <div class="playerWrap">
            <div id="player"></div>
          </div>

          <div class="playerMeta">
            <p class="nowPlaying" id="nowPlaying">Reproduciendo: —</p>
            <p class="lessonTitle" id="lessonTitle">—</p>

            <div class="playerActions">
              <button class="btn" id="btnPrev">⟵ Anterior</button>
              <button class="btn" id="btnNext">Siguiente ⟶</button>
            </div>

            <div class="hint" id="hint">
              Si el video no carga, revisa que sea <b>Público</b> o <b>No listado</b> en YouTube.
            </div>
          </div>
        </div>

        <div class="listCard">
          <div class="listHeader">
            <h2>Módulos</h2>
            <div class="pill" id="countPill">—</div>
          </div>

          <input class="search" id="search" placeholder="Buscar módulo…" />

          <div class="lessons" id="lessons"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ✅ IMPORTANTE: este endpoint es tu PROXY (Vercel)
    // Si tu proxy tiene otro dominio, cámbialo aquí.
    const API_BASE = 'https://pasir-proxy.vercel.app/api';

    // ---- Helpers ----
    const $ = (id) => document.getElementById(id);
    const qs = new URLSearchParams(location.search);
    const courseId = qs.get("courseId") || qs.get("courseid") || "";
    const token = localStorage.getItem("pasir_token") || localStorage.getItem("token") || "";

    function showError(msg){
      const box = $("errBox");
      box.style.display = "block";
      box.textContent = msg;
    }
    function clearError(){
      const box = $("errBox");
      box.style.display = "none";
      box.textContent = "";
    }

    function parseVideoIdFromEmbed(embedUrl){
      try {
        const u = new URL(embedUrl);
        const parts = u.pathname.split("/");
        return parts[parts.length-1] || "";
      } catch(e) {
        // fallback: .../embed/ID
        const m = String(embedUrl||"").match(/\/embed\/([^?]+)/);
        return m ? m[1] : "";
      }
    }
    function thumbUrl(videoId){
      // hqdefault (buena calidad sin ser muy pesada)
      return "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg";
    }

    async function api(action, params={}) {
      // El proxy acepta GET/POST. Aquí usamos GET simple.
      const u = new URL(API_BASE);
      u.searchParams.set("action", action);
      Object.entries(params).forEach(([k,v]) => {
        if (v === undefined || v === null) return;
        u.searchParams.set(k, String(v));
      });
      const r = await fetch(u.toString(), {
        method: "GET",
        mode: "cors",
        cache: "no-store",
      });
      return await r.json();
    }

    // ---- State ----
    let modules = [];
    let currentIndex = 0;
    let player = null;
    const watchedKey = () => "watched_" + courseId;

    function getWatchedSet(){
      try {
        return new Set(JSON.parse(localStorage.getItem(watchedKey()) || "[]"));
      } catch(e) {
        return new Set();
      }
    }
    function markWatched(videoId){
      const s = getWatchedSet();
      s.add(videoId);
      localStorage.setItem(watchedKey(), JSON.stringify(Array.from(s)));
    }

    function renderList(filterText=""){
      const list = $("lessons");
      list.innerHTML = "";
      const watched = getWatchedSet();

      const filtered = modules
        .map((m, idx) => ({...m, __idx: idx}))
        .filter(m => (m.title || "").toLowerCase().includes(filterText.toLowerCase()));

      $("countPill").textContent = `${filtered.length} / ${modules.length}`;

      filtered.forEach(m => {
        const isActive = m.__idx === currentIndex;
        const isWatched = watched.has(m.videoId);

        const el = document.createElement("div");
        el.className = "lesson" + (isActive ? " active" : "");
        el.innerHTML = `
          <div class="thumb">
            <img src="${thumbUrl(m.videoId)}" alt="">
            <div class="playBadge">▶</div>
          </div>
          <div class="lessonInfo">
            <p class="t">${m.order}. ${escapeHtml(m.title)}</p>
            <div class="m">
              <span>Video</span><span class="dot">•</span>
              ${isWatched ? `<span class="watched"><span class="watchedIcon">✓</span>Visto</span>` : `<span style="color: var(--muted)">Pendiente</span>`}
            </div>
          </div>
        `;
        el.addEventListener("click", () => {
          playIndex(m.__idx);
        });
        list.appendChild(el);
      });
    }

    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, (c)=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function updateHeader(){
      const cur = modules[currentIndex];
      if (!cur) return;
      $("nowPlaying").textContent = "Reproduciendo: " + (cur.title || ("Módulo " + cur.order));
      $("lessonTitle").textContent = cur.title || ("Módulo " + cur.order);
    }

    function playIndex(idx, autoplay=true){
      if (idx < 0 || idx >= modules.length) return;
      currentIndex = idx;
      updateHeader();
      renderList($("search").value || "");

      const cur = modules[currentIndex];
      if (!player) {
        // player aún no listo; guardamos y lo tomará al iniciar
        return;
      }
      player.loadVideoById({
        videoId: cur.videoId,
        startSeconds: 0,
        suggestedQuality: "hd720"
      });
      if (!autoplay) player.pauseVideo();
    }

    function goNext(){
      if (currentIndex < modules.length - 1) {
        playIndex(currentIndex + 1);
      }
    }
    function goPrev(){
      if (currentIndex > 0) {
        playIndex(currentIndex - 1);
      }
    }

    // ---- YouTube API callback ----
    window.onYouTubeIframeAPIReady = function() {
      // Se crea luego de cargar módulos, para usar el primer videoId.
      // Si aún no hay módulos, esperamos.
      maybeInitPlayer();
    };

    function maybeInitPlayer(){
      if (player || !modules.length) return;

      const first = modules[currentIndex];
      player = new YT.Player("player", {
        videoId: first.videoId,
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,                 // evita sugeridos de otros canales (YouTube igual muestra algunos propios)
          modestbranding: 1,      // reduce branding (no lo elimina al 100%)
          fs: 1,
          playsinline: 1,
          iv_load_policy: 3,      // ocultar anotaciones
          cc_load_policy: 0,
          disablekb: 0,
          // IMPORTANT: origin ayuda a evitar errores de configuración
          origin: location.origin
        },
        events: {
          onReady: () => {
            updateHeader();
            clearError();
          },
          onStateChange: (ev) => {
            // Cuando termina el video, marcamos "visto" y pasamos al siguiente automáticamente
            if (ev.data === YT.PlayerState.ENDED) {
              const cur = modules[currentIndex];
              if (cur) markWatched(cur.videoId);
              renderList($("search").value || "");
              goNext();
            }
          },
          onError: (ev) => {
            // 150/153 suelen ser por restricciones de inserción del video
            showError("No se pudo reproducir este video (error " + ev.data + "). " +
              "Verifica que el video permita inserción (embed) y que sea Público o No listado.");
          }
        }
      });
    }

    // ---- Init ----
    (async function init(){
      $("btnBack").addEventListener("click", () => location.href = "account.html");
      $("btnClose").addEventListener("click", () => location.href = "account.html");
      $("btnLogout").addEventListener("click", () => {
        localStorage.removeItem("pasir_token");
        localStorage.removeItem("token");
        location.href = "index.html";
      });
      $("btnNext").addEventListener("click", goNext);
      $("btnPrev").addEventListener("click", goPrev);

      $("search").addEventListener("input", () => {
        renderList($("search").value || "");
      });

      if (!courseId) {
        showError("Falta courseId en la URL. Ejemplo: course.html?courseId=logo8-basico");
        return;
      }
      if (!token) {
        showError("No autorizado. Inicia sesión de nuevo.");
        setTimeout(()=>location.href="login.html", 800);
        return;
      }

      $("courseSubtitle").textContent = "Cargando módulos…";

      try {
        const data = await api("course", { token, courseId });
        if (!data.ok) {
          showError(data.error || "Error cargando el curso.");
          return;
        }

        $("courseTitle").textContent = data.course?.title || courseId;
        $("courseSubtitle").textContent = "Selecciona un módulo para reproducir.";

        modules = (data.modules || []).map(m => {
          const videoId = m.videoId || parseVideoIdFromEmbed(m.embedUrl);
          return {
            order: m.order,
            title: m.title,
            videoId,
          };
        }).filter(m => m.videoId);

        if (!modules.length) {
          showError("Este curso no tiene módulos.");
          return;
        }

        // Elegir primer NO visto (si existe)
        const watched = getWatchedSet();
        const firstUnwatched = modules.findIndex(m => !watched.has(m.videoId));
        currentIndex = firstUnwatched >= 0 ? firstUnwatched : 0;

        renderList("");
        updateHeader();
        maybeInitPlayer();
      } catch (e) {
        showError("No se pudo conectar. Revisa tu conexión o el proxy (Vercel).");
        console.error(e);
      }
    })();
  </script>
</body>
</html>
